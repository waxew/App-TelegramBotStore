# این فایل رفتار عمومی Gradle و AndroidX پروژه را تنظیم می‌کند.
# حافظه JVM Gradle برای buildهای Compose افزایش داده می‌شود.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# استفاده از AndroidX برای کتابخانه‌های مدرن فعال می‌شود.
android.useAndroidX=true
# سبک رسمی Kotlin برای قالب‌بندی سورس فعال می‌شود.
kotlin.code.style=official
# R class غیرtransitive برای build سبک‌تر فعال می‌شود.
android.nonTransitiveRClass=true
# هشدار compileSdk 35 برای نسخه فعلی Android Gradle Plugin سرکوب می‌شود.
android.suppressUnsupportedCompileSdk=35
