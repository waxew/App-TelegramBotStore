# این Workflow مخصوص Build قابل تکرار App BotStore v1.4.1 از دقیقاً همان Commit موجود در main است.
name: Build App BotStore v1.4.1

# هر Push روی main و اجرای دستی Build را آغاز می‌کند تا Commitهای Connector هم Artifact دقیق تولید کنند.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# فقط خواندن سورس برای Build کافی است و مجوز اضافی داده نمی‌شود.
permissions:
  contents: read

jobs:
  build-release:
    # Runner رسمی Ubuntu برای پروژه Android استفاده می‌شود.
    runs-on: ubuntu-latest

    steps:
      # سورس دقیق Commit Triggerکننده Checkout می‌شود.
      - name: Checkout exact commit
        uses: actions/checkout@v4

      # پروژه با Java 17 ساخته می‌شود.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # چون Repository فعلاً Gradle Wrapper ندارد، Gradle 8.7 مستقیماً روی PATH قرار می‌گیرد.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # نسخه Release بدون کلید خصوصی Repository ساخته می‌شود؛ Signing بعداً با JKS دائمی پروژه انجام می‌شود.
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      # APK خام، SHA و Git HEAD برای مرحله Signing خصوصی کنار هم قرار می‌گیرند.
      - name: Prepare release inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-inputs
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" release-inputs/App-BotStore-v1.4.1-unsigned.apk
          printf '%s\n' "${GITHUB_SHA}" > release-inputs/HEAD_SHA.txt
          sha256sum release-inputs/App-BotStore-v1.4.1-unsigned.apk > release-inputs/UNSIGNED_APK_SHA256.txt

      # سورس دقیق همان Git HEAD به ZIP تبدیل می‌شود.
      - name: Package exact source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=App-BotStore-v1.4.1-source.zip HEAD
          printf '%s\n' "${GITHUB_SHA}" > SOURCE_HEAD_SHA.txt

      # APK بدون امضا برای Signing خصوصی خارج از Repository ذخیره می‌شود.
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: App-BotStore-v1.4.1-release-inputs
          path: release-inputs/
          if-no-files-found: error
          retention-days: 30

      # سورس دقیق همان Build نیز به‌صورت Artifact نگهداری می‌شود.
      - name: Upload exact source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: App-BotStore-v1.4.1-source
          path: |
            App-BotStore-v1.4.1-source.zip
            SOURCE_HEAD_SHA.txt
          if-no-files-found: error
          retention-days: 30
