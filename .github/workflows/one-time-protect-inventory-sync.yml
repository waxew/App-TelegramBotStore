# این Workflow فقط یک بار stockVersion و Refresh موجودی Backend را به Android اضافه می‌کند و سپس حذف می‌شود.
name: One-time protect inventory sync

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-protect-inventory-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch stock version persistence sync and refresh
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # StoreProduct نسخه تغییر موجودی را کنار Quantity نگه می‌دارد.
          local = Path('app/src/main/java/ir/asteam/telegrambotstore/LocalStore.kt')
          text = local.read_text(encoding='utf-8')

          model_old = '''    // تعداد موجودی فقط وقتی stockEnabled=true مصرف می‌شود و همیشه نامنفی نگه داشته می‌شود.\n    val stockQuantity: Int = 0,\n    val botId: String = ""\n)'''
          model_new = '''    // تعداد موجودی فقط وقتی stockEnabled=true مصرف می‌شود و همیشه نامنفی نگه داشته می‌شود.\n    val stockQuantity: Int = 0,\n    // این نسخه فقط وقتی فروشنده Stock را تغییر دهد عوض می‌شود؛ Syncهای معمول با نسخه ثابت Stock مصرف‌شده Backend را بازنویسی نمی‌کنند.\n    val stockVersion: String = "",\n    val botId: String = ""\n)'''
          if model_old not in text:
              raise SystemExit('StoreProduct stockVersion model anchor not found')
          text = text.replace(model_old, model_new, 1)

          load_old = '''                            stockEnabled = item.optBoolean("stockEnabled", false),\n                            stockQuantity = item.optInt("stockQuantity", 0).coerceAtLeast(0),\n                            // نبود botId در نسخه‌های قبلی به مالک اصلی مهاجرت می‌کند.\n'''
          load_new = '''                            stockEnabled = item.optBoolean("stockEnabled", false),\n                            stockQuantity = item.optInt("stockQuantity", 0).coerceAtLeast(0),\n                            stockVersion = item.optString("stockVersion", ""),\n                            // نبود botId در نسخه‌های قبلی به مالک اصلی مهاجرت می‌کند.\n'''
          if load_old not in text:
              raise SystemExit('loadProducts stockVersion anchor not found')
          text = text.replace(load_old, load_new, 1)

          save_old = '''                    put("stockEnabled", item.stockEnabled)\n                    put("stockQuantity", item.stockQuantity.coerceAtLeast(0))\n                    put("botId", item.botId)\n'''
          save_new = '''                    put("stockEnabled", item.stockEnabled)\n                    put("stockQuantity", item.stockQuantity.coerceAtLeast(0))\n                    put("stockVersion", item.stockVersion)\n                    put("botId", item.botId)\n'''
          if save_old not in text:
              raise SystemExit('saveProducts stockVersion anchor not found')
          local.write_text(text.replace(save_old, save_new, 1), encoding='utf-8')

          # Catalog Sync stockVersion را به Edge Function می‌فرستد.
          api = Path('app/src/main/java/ir/asteam/telegrambotstore/TelegramApi.kt')
          text = api.read_text(encoding='utf-8')
          sync_old = '''                            .put("stock_enabled", product.stockEnabled)\n                            .put("stock_quantity", product.stockQuantity.coerceAtLeast(0))\n'''
          sync_new = '''                            .put("stock_enabled", product.stockEnabled)\n                            .put("stock_quantity", product.stockQuantity.coerceAtLeast(0))\n                            .put("stock_version", product.stockVersion)\n'''
          if sync_old not in text:
              raise SystemExit('TelegramApi stockVersion anchor not found')
          api.write_text(text.replace(sync_old, sync_new, 1), encoding='utf-8')

          # صفحه Products موجودی واقعی Backend را هنگام ورود merge می‌کند و فقط تغییر واقعی Stock نسخه جدید می‌سازد.
          screens = Path('app/src/main/java/ir/asteam/telegrambotstore/V12Screens.kt')
          text = screens.read_text(encoding='utf-8')

          save_function_anchor = '''    fun saveVisibleProducts(updated: List<StoreProduct>) {\n        // داده سایر Botها بدون تغییر حفظ می‌شود.\n        val otherBotsProducts = products.filterNot { it.botId == ownerBotId }\n\n        // تمام آیتم‌های صفحه به‌طور قطعی با ownerBotId فعلی برچسب می‌خورند.\n        val ownedUpdated = updated.map { product -> product.copy(botId = ownerBotId) }\n\n        // لیست کامل به Activity برگردانده می‌شود.\n        onChange(otherBotsProducts + ownedUpdated)\n    }\n\n    // Dialog افزودن محصول کنترل می‌شود.\n'''
          save_function_new = '''    fun saveVisibleProducts(updated: List<StoreProduct>) {\n        // داده سایر Botها بدون تغییر حفظ می‌شود.\n        val otherBotsProducts = products.filterNot { it.botId == ownerBotId }\n\n        // تمام آیتم‌های صفحه به‌طور قطعی با ownerBotId فعلی برچسب می‌خورند.\n        val ownedUpdated = updated.map { product -> product.copy(botId = ownerBotId) }\n\n        // لیست کامل به Activity برگردانده می‌شود.\n        onChange(otherBotsProducts + ownedUpdated)\n    }\n\n    // هنگام ورود به صفحه، Stock واقعی Backend روی Productهای محلی همان UUID Merge می‌شود؛ stockVersion عمداً دست‌نخورده می‌ماند.\n    LaunchedEffect(ownerBotId, ownerBot?.token) {\n        val token = ownerBot?.token.orEmpty()\n        if (token.isBlank()) return@LaunchedEffect\n\n        BotStoreInventoryApi.fetch(token).onSuccess { backendInventory ->\n            val merged = visibleProducts.map { product ->\n                backendInventory[product.id]?.let { remote ->\n                    product.copy(\n                        stockEnabled = remote.stockEnabled,\n                        stockQuantity = remote.stockQuantity\n                    )\n                } ?: product\n            }\n            if (merged != visibleProducts) saveVisibleProducts(merged)\n        }\n    }\n\n    // Dialog افزودن محصول کنترل می‌شود.\n'''
          if save_function_anchor not in text:
              raise SystemExit('V12Products inventory refresh anchor not found')
          text = text.replace(save_function_anchor, save_function_new, 1)

          new_product_old = '''                            stockEnabled = stockEnabled,\n                            stockQuantity = if (stockEnabled) stockQuantity.toIntOrNull()?.coerceAtLeast(0) ?: 0 else 0,\n                            botId = ownerBotId\n'''
          new_product_new = '''                            stockEnabled = stockEnabled,\n                            stockQuantity = if (stockEnabled) stockQuantity.toIntOrNull()?.coerceAtLeast(0) ?: 0 else 0,\n                            // Product دارای Stock از اولین مقدار یک نسخه یکتا می‌گیرد تا Backend آن را به‌عنوان تنظیم عمدی فروشنده بپذیرد.\n                            stockVersion = if (stockEnabled) java.util.UUID.randomUUID().toString() else "",\n                            botId = ownerBotId\n'''
          if new_product_old not in text:
              raise SystemExit('New product stockVersion anchor not found')
          text = text.replace(new_product_old, new_product_new, 1)

          edit_old = '''                        val updated = product.copy(\n                            title = editTitle.trim(),\n                            price = editPrice.toLongOrNull() ?: product.price,\n                            category = editCategory.trim(),\n                            stockEnabled = editStockEnabled,\n                            stockQuantity = if (editStockEnabled) editStockQuantity.toIntOrNull()?.coerceAtLeast(0) ?: 0 else 0\n                        )\n'''
          edit_new = '''                        val nextStockQuantity = if (editStockEnabled)\n                            editStockQuantity.toIntOrNull()?.coerceAtLeast(0) ?: 0\n                        else 0\n                        val stockChanged = editStockEnabled != product.stockEnabled ||\n                            nextStockQuantity != product.stockQuantity\n\n                        val updated = product.copy(\n                            title = editTitle.trim(),\n                            price = editPrice.toLongOrNull() ?: product.price,\n                            category = editCategory.trim(),\n                            stockEnabled = editStockEnabled,\n                            stockQuantity = nextStockQuantity,\n                            // تغییر قیمت/عنوان نسخه Stock را عوض نمی‌کند؛ فقط تغییر واقعی موجودی یک نسخه جدید می‌سازد.\n                            stockVersion = if (stockChanged) java.util.UUID.randomUUID().toString() else product.stockVersion\n                        )\n'''
          if edit_old not in text:
              raise SystemExit('Edit product stockVersion anchor not found')
          screens.write_text(text.replace(edit_old, edit_new, 1), encoding='utf-8')
          PY

          git diff --check
          git diff -- app/src/main/java/ir/asteam/telegrambotstore/LocalStore.kt app/src/main/java/ir/asteam/telegrambotstore/TelegramApi.kt app/src/main/java/ir/asteam/telegrambotstore/V12Screens.kt

      - name: Commit stock-version patch
        shell: bash
        run: |
          git config user.name 'AS Team BotStore CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/ir/asteam/telegrambotstore/LocalStore.kt
          git add app/src/main/java/ir/asteam/telegrambotstore/TelegramApi.kt
          git add app/src/main/java/ir/asteam/telegrambotstore/V12Screens.kt
          git commit -m 'Protect backend stock from stale Android sync'
          git push origin HEAD:main
