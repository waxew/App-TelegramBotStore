# این Workflow فقط برای اعمال یک Patch کنترل‌شده روی Activity استفاده می‌شود و پس از موفقیت حذف خواهد شد.
name: One-time fix selected bot

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-fix-selected-bot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch selected bot state safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/ir/asteam/telegrambotstore/V12Activity.kt')
          text = path.read_text(encoding='utf-8')

          # اگر Patch قبلاً اعمال شده باشد، فایل دوباره تغییر داده نمی‌شود.
          if 'onSelectBot: (ConnectedBot) -> Unit' in text:
              print('Selected-bot patch already applied.')
          else:
              import_anchor = 'import androidx.compose.ui.platform.LocalContext\n'
              if import_anchor not in text:
                  raise SystemExit('LocalContext import anchor not found')
              text = text.replace(
                  import_anchor,
                  import_anchor + '// واحد dp برای padding استاندارد Compose استفاده می‌شود.\nimport androidx.compose.ui.unit.dp\n',
                  1,
              )

              root_anchor = '''        onBotUpdate = { updated ->\n            // Bot ویرایش‌شده داخل لیست جایگزین می‌شود.\n'''
              if root_anchor not in text:
                  raise SystemExit('Root onBotUpdate anchor not found')
              text = text.replace(
                  root_anchor,
                  '''        onSelectBot = { bot ->\n            // شناسه Bot انتخاب‌شده واقعاً تغییر می‌کند تا مدیریت، Catalog، سفارش‌ها و کاربران همان فروشگاه را هدف بگیرند.\n            selectedBotId = bot.id\n        },\n        onBotUpdate = { updated ->\n            // Bot ویرایش‌شده داخل لیست جایگزین می‌شود.\n''',
                  1,
              )

              signature_anchor = '''    onConnected: (ConnectedBot) -> Unit,\n    onBotUpdate: (ConnectedBot) -> Unit,\n'''
              if signature_anchor not in text:
                  raise SystemExit('V12Shell signature anchor not found')
              text = text.replace(
                  signature_anchor,
                  '''    onConnected: (ConnectedBot) -> Unit,\n    // انتخاب Bot فقط state انتخاب را تغییر می‌دهد و برخلاف ویرایش، داده Bot را دوباره ذخیره نمی‌کند.\n    onSelectBot: (ConnectedBot) -> Unit,\n    onBotUpdate: (ConnectedBot) -> Unit,\n''',
                  1,
              )

              dashboard_anchor = '''                        onSelectBot = { bot ->\n                            selectedBot?.let { /* فقط برای حفظ state در Composition */ }\n                            // Bot انتخاب‌شده از طریق callback Activity مدیریت می‌شود.\n                            if (bot.id != selectedBotId) {\n                                // در نسخه فعلی callback مستقیم تغییر selectedBotId در این سطح وجود ندارد؛ مدیریت Bot از Dashboard با همان Bot انجام می‌شود.\n                            }\n                            onPage(V12Page.BOT_MANAGER)\n                        },\n'''
              if dashboard_anchor not in text:
                  raise SystemExit('Dashboard selection anchor not found')
              text = text.replace(
                  dashboard_anchor,
                  '''                        onSelectBot = { bot ->\n                            // ابتدا Bot انتخاب‌شده در Root ثبت می‌شود تا تمام صفحات بعدی به همان فروشگاه متصل باشند.\n                            onSelectBot(bot)\n                            // سپس صفحه مدیریت همان Bot باز می‌شود.\n                            onPage(V12Page.BOT_MANAGER)\n                        },\n''',
                  1,
              )

              # دو فراخوانی قدیمی fully-qualified با API استاندارد Compose جایگزین می‌شوند.
              text = text.replace(
                  'androidx.compose.ui.Modifier.padding(vertical = androidx.compose.ui.unit.dp(6f))',
                  'androidx.compose.ui.Modifier.padding(vertical = 6.dp)',
              )

              # توضیح نسخه فایل با نسخه جاری هماهنگ می‌شود.
              text = text.replace('نسخه ۱.۳.۰', 'نسخه ۱.۳.۱')
              path.write_text(text, encoding='utf-8')

          # Shim موقت دیگر لازم نیست و از سورس پاک می‌شود.
          shim = Path('app/src/main/java/androidx/compose/ui/unit/AppBotStoreDpCompat.kt')
          if shim.exists():
              shim.unlink()
          PY

          git diff --check
          git diff -- app/src/main/java/ir/asteam/telegrambotstore/V12Activity.kt app/src/main/java/androidx/compose/ui/unit/AppBotStoreDpCompat.kt

      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'AS Team BotStore CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/ir/asteam/telegrambotstore/V12Activity.kt
          git add -A app/src/main/java/androidx/compose/ui/unit/
          git commit -m 'Fix multi-bot selection state and remove dp shim'
          git push origin HEAD:main
