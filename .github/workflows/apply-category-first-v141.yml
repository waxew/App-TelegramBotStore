# این Workflow موقت Patch مدیریت Category-first نسخه ۱.۴.۱ را روی Branch آزمایشی اعمال و قبل از Push نهایی Build می‌کند.
name: Apply and test category-first v1.4.1

on:
  push:
    branches:
      - category-first-v141
    paths:
      - .github/workflows/apply-category-first-v141.yml

permissions:
  contents: write

jobs:
  apply-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d ci-temp/v141-category-first.patch.b64 | gzip -d > /tmp/v141.patch
          git apply --check /tmp/v141.patch
          git apply /tmp/v141.patch
          git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK before committing
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Commit only the tested source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci-temp
          rm -f .github/workflows/apply-category-first-v141.yml
          git diff --check
          git config user.name "AS Team Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix category-first product management in v1.4.1"
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/HEAD_SHA.txt
          git archive --format=zip --output=/tmp/App-BotStore-v1.4.1-source.zip HEAD
          cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/App-BotStore-v1.4.1-unsigned.apk
          sha256sum /tmp/App-BotStore-v1.4.1-unsigned.apk > /tmp/UNSIGNED_APK_SHA256.txt
          git push origin HEAD:category-first-v141

      - name: Upload tested release inputs
        uses: actions/upload-artifact@v4
        with:
          name: App-BotStore-v1.4.1-category-first-tested
          path: |
            /tmp/App-BotStore-v1.4.1-unsigned.apk
            /tmp/HEAD_SHA.txt
            /tmp/UNSIGNED_APK_SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact tested source
        uses: actions/upload-artifact@v4
        with:
          name: App-BotStore-v1.4.1-source-tested
          path: /tmp/App-BotStore-v1.4.1-source.zip
          if-no-files-found: error
          retention-days: 30
