# این Workflow موقت Patch نسخه 1.4.1 را فقط روی کد برنامه اعمال می‌کند؛ فایل‌های Workflow جداگانه با دسترسی کاربر مدیریت می‌شوند.
name: Apply category-first v1.4.1 patch

on:
  push:
    branches:
      - category-first-v141
    paths:
      - 'ci-temp/category-first-v141.part5'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      # شاخه آزمایشی با تمام تاریخچه لازم Checkout می‌شود.
      - name: Checkout category-first branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # پنج قطعه موقت دوباره به Patch اصلی تبدیل و قبل از اعمال اعتبارسنجی می‌شوند.
      - name: Rebuild and apply code patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            ci-temp/category-first-v141.part1 \
            ci-temp/category-first-v141.part2 \
            ci-temp/category-first-v141.part3 \
            ci-temp/category-first-v141.part4 \
            ci-temp/category-first-v141.part5 > /tmp/category-first-v141.patch.gz.b64
          base64 -d /tmp/category-first-v141.patch.gz.b64 > /tmp/category-first-v141.patch.gz
          gzip -dc /tmp/category-first-v141.patch.gz > /tmp/category-first-v141.patch

          git apply --check /tmp/category-first-v141.patch
          git apply /tmp/category-first-v141.patch

          # GitHub Actions اجازه Push تغییر Workflow را با Token موقت نمی‌دهد؛ تمام فایل‌های .github به حالت شاخه برگردانده می‌شوند.
          git checkout -- .github
          rm -f .github/workflows/build-v141.yml

          # قبل از Commit، خطاهای whitespace و ناسازگاری Patch کنترل می‌شوند.
          git diff --check

      # فقط فایل‌های واقعی برنامه و مستندات Commit می‌شوند؛ فایل‌های انتقال Patch دست‌نخورده می‌مانند تا Trigger دوباره نشود.
      - name: Commit category-first implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AS Team BotStore CI'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            CHANGELOG.md \
            README.md \
            ROADMAP.md \
            app/build.gradle.kts \
            app/src/main/java/ir/asteam/telegrambotstore/LocalStore.kt \
            app/src/main/java/ir/asteam/telegrambotstore/TelegramApi.kt \
            app/src/main/java/ir/asteam/telegrambotstore/V12Activity.kt \
            app/src/main/java/ir/asteam/telegrambotstore/V12Screens.kt
          git diff --cached --check
          git commit -m 'Make catalog category-first in v1.4.1'
          git push origin HEAD:category-first-v141
