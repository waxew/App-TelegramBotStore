# این Workflow فقط یک بار UX موجودی Telegram را Patch می‌کند و پس از موفقیت حذف خواهد شد.
name: One-time inventory Telegram UX

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-inventory-telegram-ux.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch inventory-aware Telegram UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/supabase/functions/botstore-telegram/index.ts')
          text = path.read_text(encoding='utf-8')

          # جزئیات Product موجودی را می‌خواند و Product صفرموجودی دکمه افزودن ندارد.
          old = ".select('id, title, price, description, active')"
          new = ".select('id, title, price, description, active, stock_enabled, stock_quantity')"
          if old not in text:
              raise SystemExit('product detail select anchor not found')
          text = text.replace(old, new, 1)

          old = '''  await telegramCall(token, 'sendMessage', {\n    chat_id: chatId,\n    text: `🛍️ ${product.title}\\n\\n${product.description || 'بدون توضیحات'}\\n\\n💳 ${money(Number(product.price))} تومان`,\n    reply_markup: {\n      inline_keyboard: [\n        [{ text: '➕ افزودن به سبد خرید', callback_data: `cart_add:${product.id}` }],\n        [{ text: '🛒 مشاهده سبد خرید', callback_data: 'cart_show' }],\n      ],\n    },\n  })\n'''
          new = '''  const stockEnabled = Boolean(product.stock_enabled)\n  const stockQuantity = Math.max(0, Number(product.stock_quantity ?? 0))\n  const outOfStock = stockEnabled && stockQuantity <= 0\n  const stockLine = !stockEnabled\n    ? '📦 موجودی: نامحدود'\n    : outOfStock\n      ? '⛔ ناموجود'\n      : `📦 موجودی: ${money(stockQuantity)}`\n\n  const productButtons: any[][] = []\n  if (!outOfStock) {\n    productButtons.push([{ text: '➕ افزودن به سبد خرید', callback_data: `cart_add:${product.id}` }])\n  }\n  productButtons.push([{ text: '🛒 مشاهده سبد خرید', callback_data: 'cart_show' }])\n\n  await telegramCall(token, 'sendMessage', {\n    chat_id: chatId,\n    text: `🛍️ ${product.title}\\n\\n${product.description || 'بدون توضیحات'}\\n\\n💳 ${money(Number(product.price))} تومان\\n${stockLine}`,\n    reply_markup: { inline_keyboard: productButtons },\n  })\n'''
          if old not in text:
              raise SystemExit('product detail message anchor not found')
          text = text.replace(old, new, 1)

          # Cart موجودی فعلی را همراه Productها می‌خواند.
          old = ".select('id, title, price, active')"
          new = ".select('id, title, price, active, stock_enabled, stock_quantity')"
          if old not in text:
              raise SystemExit('cart product select anchor not found')
          text = text.replace(old, new, 1)

          old = '''    const lineTotal = Number(product.price) * quantity\n    total += lineTotal\n    lines.push(`${index + 1}) ${product.title} × ${quantity}\\n${money(lineTotal)} تومان`)\n    buttons.push([\n      { text: `➖ ${product.title}`, callback_data: `cart_dec:${product.id}` },\n      { text: `➕ ${quantity}`, callback_data: `cart_add:${product.id}` },\n    ])\n'''
          new = '''    const lineTotal = Number(product.price) * quantity\n    total += lineTotal\n    const stockEnabled = Boolean(product.stock_enabled)\n    const stockQuantity = Math.max(0, Number(product.stock_quantity ?? 0))\n    const stockWarning = stockEnabled && quantity > stockQuantity\n      ? `\\n⚠️ موجودی فعلی: ${money(stockQuantity)}`\n      : ''\n    lines.push(`${index + 1}) ${product.title} × ${quantity}\\n${money(lineTotal)} تومان${stockWarning}`)\n\n    const rowButtons: any[] = [\n      { text: `➖ ${product.title}`, callback_data: `cart_dec:${product.id}` },\n    ]\n    // وقتی Cart به سقف موجودی رسیده باشد دکمه افزایش نمایش داده نمی‌شود.\n    if (!stockEnabled || quantity < stockQuantity) {\n      rowButtons.push({ text: `➕ ${quantity}`, callback_data: `cart_add:${product.id}` })\n    }\n    buttons.push(rowButtons)\n'''
          if old not in text:
              raise SystemExit('cart line anchor not found')
          text = text.replace(old, new, 1)

          # فهرست بدون Category موجودی را در عنوان Button نشان می‌دهد.
          old = ".select('id, title, price')"
          new = ".select('id, title, price, stock_enabled, stock_quantity')"
          if old not in text:
              raise SystemExit('products list select anchor not found')
          text = text.replace(old, new, 1)

          old = '''        text: `${product.title} — ${money(Number(product.price))} تومان`,\n        callback_data: `product:${product.id}`,\n'''
          new = '''        text: `${product.title} — ${money(Number(product.price))} تومان${product.stock_enabled ? (Number(product.stock_quantity) > 0 ? ` • موجودی ${money(Number(product.stock_quantity))}` : ' • ناموجود') : ''}`,\n        callback_data: `product:${product.id}`,\n'''
          if old not in text:
              raise SystemExit('products list button anchor not found')
          text = text.replace(old, new, 1)

          # Category listing نیز موجودی را می‌خواند و در Button نمایش می‌دهد.
          old = ".from('botstore_products').select('id, title, price').eq('bot_id', botId).eq('category_id', categoryId)"
          new = ".from('botstore_products').select('id, title, price, stock_enabled, stock_quantity').eq('bot_id', botId).eq('category_id', categoryId)"
          if old not in text:
              raise SystemExit('category product select anchor not found')
          text = text.replace(old, new, 1)

          # دومین occurrence عنوان Product در Category با وضعیت موجودی جایگزین می‌شود.
          old = '''                text: `${product.title} — ${money(Number(product.price))} تومان`,\n                callback_data: `product:${product.id}`,\n'''
          new = '''                text: `${product.title} — ${money(Number(product.price))} تومان${product.stock_enabled ? (Number(product.stock_quantity) > 0 ? ` • موجودی ${money(Number(product.stock_quantity))}` : ' • ناموجود') : ''}`,\n                callback_data: `product:${product.id}`,\n'''
          if old not in text:
              raise SystemExit('category product button anchor not found')
          text = text.replace(old, new, 1)

          # خطای Checkout بر اساس پیام RPC به متن دقیق فارسی تبدیل می‌شود.
          old = '''        if (error || !checkoutRows?.length) {\n          await telegramCall(token, 'sendMessage', { chat_id: chatId, text: 'سبد خرید خالی است یا ثبت سفارش در حال حاضر ممکن نیست.' })\n          return new Response('ok', { status: 200 })\n        }\n'''
          new = '''        if (error || !checkoutRows?.length) {\n          const errorText = String(error?.message ?? '').toLowerCase()\n          const userMessage = errorText.includes('insufficient stock')\n            ? 'موجودی یک یا چند محصول کافی نیست؛ لطفاً سبد خرید را بررسی کنید.'\n            : errorText.includes('product not available')\n              ? 'یکی از محصولات سبد دیگر قابل سفارش نیست؛ لطفاً سبد را بررسی کنید.'\n              : 'سبد خرید خالی است یا ثبت سفارش در حال حاضر ممکن نیست.'\n          await telegramCall(token, 'sendMessage', { chat_id: chatId, text: userMessage })\n          return new Response('ok', { status: 200 })\n        }\n'''
          if old not in text:
              raise SystemExit('checkout error anchor not found')
          text = text.replace(old, new, 1)

          # افزودن بیشتر از Stock پیام «موجودی کافی نیست» می‌دهد.
          old = '''        if (error) {\n          await telegramCall(token, 'sendMessage', { chat_id: chatId, text: 'این محصول در حال حاضر قابل افزودن به سبد نیست.' })\n        } else {\n'''
          new = '''        if (error) {\n          const errorText = String(error.message ?? '').toLowerCase()\n          await telegramCall(token, 'sendMessage', {\n            chat_id: chatId,\n            text: errorText.includes('insufficient stock')\n              ? 'موجودی کافی برای این تعداد وجود ندارد.'\n              : 'این محصول در حال حاضر قابل افزودن به سبد نیست.',\n          })\n        } else {\n'''
          if old not in text:
              raise SystemExit('cart change error anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- backend/supabase/functions/botstore-telegram/index.ts

      - name: Commit inventory UX patch
        shell: bash
        run: |
          git config user.name 'AS Team BotStore CI'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/supabase/functions/botstore-telegram/index.ts
          git commit -m 'Make Telegram runtime inventory-aware'
          git push origin HEAD:main
