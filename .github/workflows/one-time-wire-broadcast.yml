# این Workflow فقط یک بار برای اتصال صفحه ارسال همگانی به Navigation اجرا می‌شود و سپس حذف خواهد شد.
name: One-time wire broadcast

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-wire-broadcast.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch broadcast navigation safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # صفحه BROADCAST به enum رسمی Navigation اضافه می‌شود.
          core = Path('app/src/main/java/ir/asteam/telegrambotstore/V12Core.kt')
          core_text = core.read_text(encoding='utf-8')
          enum_old = '''    CUSTOMERS("کاربران فروشگاه"),\n    SETTINGS("تنظیمات"),'''
          enum_new = '''    CUSTOMERS("کاربران فروشگاه"),\n    BROADCAST("ارسال همگانی"),\n    SETTINGS("تنظیمات"),'''
          if enum_old not in core_text:
              raise SystemExit('V12Core broadcast enum anchor not found')
          core.write_text(core_text.replace(enum_old, enum_new, 1), encoding='utf-8')

          # Drawer، صفحه مدیریت Bot و when اصلی Activity به صفحه جدید وصل می‌شوند.
          activity = Path('app/src/main/java/ir/asteam/telegrambotstore/V12Activity.kt')
          text = activity.read_text(encoding='utf-8')

          drawer_old = '''                // کاربران فروشگاه و کنترل Block/Unblock از Backend همان Bot مدیریت می‌شوند.\n                DrawerItem(Icons.Outlined.Groups, "کاربران فروشگاه", page == V12Page.CUSTOMERS) {\n                    onPage(V12Page.CUSTOMERS)\n                    scope.launch { drawer.close() }\n                }\n                // پیش‌نمایش ربات از منوی اصلی در دسترس قرار می‌گیرد.\n'''
          drawer_new = '''                // کاربران فروشگاه و کنترل Block/Unblock از Backend همان Bot مدیریت می‌شوند.\n                DrawerItem(Icons.Outlined.Groups, "کاربران فروشگاه", page == V12Page.CUSTOMERS) {\n                    onPage(V12Page.CUSTOMERS)\n                    scope.launch { drawer.close() }\n                }\n                // ارسال همگانی فقط به کاربران Block‌نشده Bot انتخاب‌شده انجام می‌شود.\n                DrawerItem(Icons.Outlined.Campaign, "ارسال همگانی", page == V12Page.BROADCAST) {\n                    selectedBot?.let { onPage(V12Page.BROADCAST) } ?: onPage(V12Page.DASHBOARD)\n                    scope.launch { drawer.close() }\n                }\n                // پیش‌نمایش ربات از منوی اصلی در دسترس قرار می‌گیرد.\n'''
          if drawer_old not in text:
              raise SystemExit('Activity Drawer broadcast anchor not found')
          text = text.replace(drawer_old, drawer_new, 1)

          manager_old = '''                                onGeneralManagement = { onPage(V12Page.GENERAL_MANAGEMENT) },\n                                onProducts = { onPage(V12Page.PRODUCTS) },'''
          manager_new = '''                                onGeneralManagement = { onPage(V12Page.GENERAL_MANAGEMENT) },\n                                onBroadcast = { onPage(V12Page.BROADCAST) },\n                                onProducts = { onPage(V12Page.PRODUCTS) },'''
          if manager_old not in text:
              raise SystemExit('Activity BotManager broadcast anchor not found')
          text = text.replace(manager_old, manager_new, 1)

          route_old = '''                    // کاربران همان فروشگاه و وضعیت Block/Unblock مدیریت می‌شوند.\n                    V12Page.CUSTOMERS -> V12Customers(selectedBot)\n                    // پیش‌نمایش منوی ربات نمایش داده می‌شود.\n'''
          route_new = '''                    // کاربران همان فروشگاه و وضعیت Block/Unblock مدیریت می‌شوند.\n                    V12Page.CUSTOMERS -> V12Customers(selectedBot)\n                    // صف ارسال همگانی قابل Resume فقط برای Bot انتخاب‌شده نمایش داده می‌شود.\n                    V12Page.BROADCAST -> {\n                        selectedBot?.let { V12Broadcast(it) } ?: EmptyState(\n                            "رباتی انتخاب نشده",\n                            "ابتدا از داشبورد یک ربات را انتخاب کنید.",\n                            Icons.Filled.SmartToy\n                        )\n                    }\n                    // پیش‌نمایش منوی ربات نمایش داده می‌شود.\n'''
          if route_old not in text:
              raise SystemExit('Activity broadcast route anchor not found')
          activity.write_text(text.replace(route_old, route_new, 1), encoding='utf-8')

          # کارت ارسال همگانی به صفحه مدیریت همان Bot اضافه می‌شود.
          screens = Path('app/src/main/java/ir/asteam/telegrambotstore/V12Screens.kt')
          screens_text = screens.read_text(encoding='utf-8')

          signature_old = '''    onGeneralManagement: () -> Unit,\n    onProducts: () -> Unit,'''
          signature_new = '''    onGeneralManagement: () -> Unit,\n    onBroadcast: () -> Unit,\n    onProducts: () -> Unit,'''
          if signature_old not in screens_text:
              raise SystemExit('V12BotManager broadcast signature anchor not found')
          screens_text = screens_text.replace(signature_old, signature_new, 1)

          cards_old = '''        item { ActionCard("مدیریت عمومی", "نام فروشگاه، خوش‌آمدگویی، پشتیبانی و درباره", Icons.Outlined.Tune, Blue, onGeneralManagement) }\n        item { ActionCard("محصولات", "مدیریت محصولات همین فروشگاه", Icons.Outlined.Inventory2, TelegramBlue, onProducts) }\n'''
          cards_new = '''        item { ActionCard("مدیریت عمومی", "نام فروشگاه، خوش‌آمدگویی، پشتیبانی و درباره", Icons.Outlined.Tune, Blue, onGeneralManagement) }\n        item { ActionCard("ارسال همگانی", "صف امن و قابل ادامه برای کاربران همین Bot", Icons.Outlined.Campaign, Warning, onBroadcast) }\n        item { ActionCard("محصولات", "مدیریت محصولات همین فروشگاه", Icons.Outlined.Inventory2, TelegramBlue, onProducts) }\n'''
          if cards_old not in screens_text:
              raise SystemExit('V12BotManager broadcast card anchor not found')
          screens.write_text(screens_text.replace(cards_old, cards_new, 1), encoding='utf-8')
          PY

          git diff --check
          git diff -- app/src/main/java/ir/asteam/telegrambotstore/V12Core.kt app/src/main/java/ir/asteam/telegrambotstore/V12Activity.kt app/src/main/java/ir/asteam/telegrambotstore/V12Screens.kt

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'AS Team BotStore CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/ir/asteam/telegrambotstore/V12Core.kt
          git add app/src/main/java/ir/asteam/telegrambotstore/V12Activity.kt
          git add app/src/main/java/ir/asteam/telegrambotstore/V12Screens.kt
          git commit -m 'Wire resumable broadcast management into Android'
          git push origin HEAD:main
