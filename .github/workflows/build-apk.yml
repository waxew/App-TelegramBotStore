# این Workflow در هر push به main نسخه Release و بسته سورس پروژه را می‌سازد.
name: Build Android Release

# رویدادهای اجرای Workflow تعریف می‌شوند.
on:
  # هر Push روی main باعث Build می‌شود؛ شاخه category-first-v141 فقط برای QA همین تغییر موقتاً اضافه شده است.
  push:
    branches: [ main, category-first-v141 ]
  # Pull Request به main نیز برای کنترل کامپایل Build می‌شود.
  pull_request:
    branches: [ main ]
  # اجرای دستی از تب Actions نیز ممکن است.
  workflow_dispatch:

# Workflow فقط به خواندن سورس نیاز دارد.
permissions:
  contents: read

# Job ساخت نسخه Release تعریف می‌شود.
jobs:
  build:
    # Runner رسمی Ubuntu استفاده می‌شود.
    runs-on: ubuntu-latest
    steps:
      # سورس آخرین Commit دریافت می‌شود.
      - name: Checkout source
        uses: actions/checkout@v4

      # Java 17 مورد نیاز Android Gradle Plugin آماده می‌شود.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK روی Runner نصب و تنظیم می‌شود.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Gradle نسخه سازگار با پروژه آماده می‌شود.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # نسخه Release واقعی برنامه کامپایل می‌شود.
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      # apksigner رسمی SDK برای امضای خصوصی خارج از مخزن عمومی استخراج می‌شود.
      - name: Export apksigner tool
        shell: bash
        run: |
          APKSIGNER_JAR="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner.jar | sort -V | tail -n 1)"
          test -n "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" "$RUNNER_TEMP/apksigner.jar"

      # یک ZIP تمیز از سورس بدون خروجی Build و کلیدهای خصوصی ساخته می‌شود.
      - name: Package source code
        shell: bash
        run: |
          zip -r "$RUNNER_TEMP/App-BotStore-v1.4.1-source.zip" . \
            -x '.git/*' '.gradle/*' '.idea/*' '*/build/*' '*.jks' '*.keystore' '*.idsig'

      # APK خام Release و apksigner برای مرحله امضای خصوصی ذخیره می‌شوند.
      - name: Upload release signing inputs
        uses: actions/upload-artifact@v4
        with:
          name: App-BotStore-v1.4.1-release-inputs
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            ${{ runner.temp }}/apksigner.jar
          if-no-files-found: error
          retention-days: 7

      # ZIP سورس برای دانلود و نگهداری روی لپ‌تاپ ذخیره می‌شود.
      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: App-BotStore-v1.4.1-source
          path: ${{ runner.temp }}/App-BotStore-v1.4.1-source.zip
          if-no-files-found: error
          retention-days: 30
