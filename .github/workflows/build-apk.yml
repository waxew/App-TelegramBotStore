name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Export apksigner tool
        shell: bash
        run: |
          APKSIGNER_JAR="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner.jar | sort -V | tail -n 1)"
          test -n "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" "$RUNNER_TEMP/apksigner.jar"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramBotStore-v1.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release signing inputs
        uses: actions/upload-artifact@v4
        with:
          name: TelegramBotStore-v1.2-release-inputs
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            ${{ runner.temp }}/apksigner.jar
          if-no-files-found: error
          retention-days: 7
