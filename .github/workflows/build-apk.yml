# این Workflow در هر push به main فایل‌های APK نسخه فعلی را می‌سازد.
name: Build Android APK

# رویدادهای اجرا تعریف می‌شوند.
on:
  # Push روی شاخه main باعث build می‌شود.
  push:
    # فقط شاخه main برای push پایش می‌شود.
    branches: [ main ]
  # Pull Request به main نیز build را اجرا می‌کند.
  pull_request:
    # فقط PRهای مقصد main بررسی می‌شوند.
    branches: [ main ]
  # اجرای دستی Workflow نیز ممکن است.
  workflow_dispatch:

# سطح دسترسی Workflow فقط خواندن محتوا است.
permissions:
  # سورس مخزن فقط خوانده می‌شود.
  contents: read

# Jobهای Workflow تعریف می‌شوند.
jobs:
  # Job ساخت APK تعریف می‌شود.
  build:
    # Runner لینوکسی Ubuntu استفاده می‌شود.
    runs-on: ubuntu-latest
    # مراحل Job به ترتیب اجرا می‌شوند.
    steps:
      # سورس پروژه Checkout می‌شود.
      - name: Checkout
        uses: actions/checkout@v4

      # Java 17 مورد نیاز Android Gradle Plugin نصب می‌شود.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK روی runner آماده می‌شود.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Gradle 8.7 آماده می‌شود.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # APK دیباگ برای تست سریع ساخته می‌شود.
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      # APK Release بدون امضا برای امضای خارج از مخزن عمومی ساخته می‌شود.
      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      # ابزار رسمی apksigner از Android SDK برای مرحله امضای خصوصی استخراج می‌شود.
      - name: Export apksigner tool
        shell: bash
        run: |
          APKSIGNER_JAR="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner.jar | sort -V | tail -n 1)"
          test -n "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" "$RUNNER_TEMP/apksigner.jar"

      # APK دیباگ به‌عنوان Artifact ذخیره می‌شود.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: App-BotStore-v1.2.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # APK Release خام و apksigner برای مرحله امضای خصوصی ذخیره می‌شوند.
      - name: Upload release signing inputs
        uses: actions/upload-artifact@v4
        with:
          name: App-BotStore-v1.2.1-release-inputs
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            ${{ runner.temp }}/apksigner.jar
          if-no-files-found: error
          retention-days: 7
